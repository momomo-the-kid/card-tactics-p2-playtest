<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#11161d">
  <link rel="stylesheet" href="style.css">
  <script src="effects.js" defer></script>
  <script src="sounds.js" defer></script>
  <script src="preview.js" defer></script>
  <title>召喚エフェクト・SE比較 | CARD × TACTICS</title>
</head>
<body>
  <main>
    <header>
      <span class="brand">CARD × TACTICS</span>
      <h1>召喚エフェクト・SE比較</h1>
      <p>候補を選び、同じ盤面で聞き比べ・見比べができます。</p>
    </header>
    <div class="comparison">
      <section class="preview" aria-label="召喚プレビュー">
        <div class="stage">
          <div id="board" class="board" aria-hidden="true"></div>
          <div class="summon" aria-hidden="true">
            <img id="unit" src="../assets/creature/gold.png" alt="" width="512" height="341" draggable="false">
            <div id="effects" class="effects"></div>
          </div>
        </div>
        <p class="stage-caption"><span>比較用の駒 · 金級兵</span><span>比較版 1</span></p>
      </section>
      <section class="controls" aria-label="候補と再生設定">
        <div class="candidate">
          <label for="effect">召喚エフェクト</label>
          <select id="effect" aria-describedby="effectInfo"></select>
          <p id="effectInfo"></p>
        </div>
        <div class="candidate">
          <label for="sound">召喚SE</label>
          <select id="sound" aria-describedby="soundInfo"></select>
          <p id="soundInfo"></p>
        </div>
        <div class="play-buttons" aria-label="再生操作" role="group">
          <button type="button" data-play="effect">エフェクトのみ</button>
          <button type="button" data-play="sound">SEのみ</button>
          <button type="button" data-play="both" class="primary">組み合わせ</button>
          <button type="button" id="stop">停止</button>
        </div>
        <div class="options">
          <div class="volume">
            <label for="volume">SE音量</label>
            <input id="volume" type="range" min="0" max="100" value="55">
            <output id="level" for="volume">55%</output>
          </div>
          <label class="check"><input type="checkbox" id="mute">ミュート</label>
          <label class="check"><input type="checkbox" id="gentle">動きを減らす</label>
        </div>
        <p id="status" class="status" role="status">再生ボタンを押すと試せます。</p>
      </section>
    </div>
  </main>
</body>
</html>
